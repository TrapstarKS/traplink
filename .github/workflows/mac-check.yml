name: Mac check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to check"
        required: true
        default: main
        type: string

permissions: {}

concurrency:
  group: mac-check
  cancel-in-progress: false

env:
  CI: "true"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  MANIFEST: apps/desktop/src-tauri/Cargo.toml

jobs:
  check:
    name: cargo check, test and clippy (macOS)
    runs-on: [self-hosted, macOS, ARM64, traplink]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Use machine toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            if [ -d "$dir" ]; then echo "$dir" >> "$GITHUB_PATH"; fi
          done
          echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/cargo-target" >> "$GITHUB_ENV"

      - name: Prepare frontend placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          if [ ! -f apps/desktop/dist/index.html ]; then
            echo '<!doctype html><title>TrapLink</title>' > apps/desktop/dist/index.html
          fi

      - name: cargo check
        shell: bash
        run: cargo check --locked --manifest-path "$MANIFEST"

      - name: cargo test
        shell: bash
        run: cargo test --locked --manifest-path "$MANIFEST"

      - name: cargo clippy
        shell: bash
        run: |
          set -euo pipefail
          if cargo clippy --version >/dev/null 2>&1; then
            cargo clippy --locked --manifest-path "$MANIFEST" -- -D warnings
          else
            echo "clippy is not installed on this runner; skipping."
          fi
