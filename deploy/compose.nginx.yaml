name: traplink
services:
  migrate:
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    env_file: .env
    environment:
      DATABASE_PATH: /data/traplink.sqlite
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - traplink-data:/data
    restart: "no"
  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    env_file: .env
    environment:
      DATABASE_PATH: /data/traplink.sqlite
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - traplink-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3801:3100"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  traplink-data:
